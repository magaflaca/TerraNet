<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TerraNet</title>
  <meta name="description" content="Host Terraria worlds from your phone or PC and play with friends anywhere.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TerraNet">
  <meta property="og:url" content="https://terra.hacks.win/">
  <meta property="og:title" content="TerraNet">
  <meta property="og:description" content="Host Terraria worlds from your phone or PC and let friends join from anywhere. Free, simple, vanilla by default.">
  <meta property="og:image" content="https://terra.hacks.win/og.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TerraNet: host Terraria worlds from your phone or PC">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TerraNet">
  <meta name="twitter:description" content="Host Terraria worlds from your phone or PC and let friends join from anywhere.">
  <meta name="twitter:image" content="https://terra.hacks.win/og.png?v=2">
  <meta name="theme-color" content="#86CBFF">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script>window.TERRANET = __TERRANET__;</script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <main>
    <header class="hero">
      <h1 class="title"><span class="terra">Terra</span><span class="net">Net</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </header>
    <section class="downloads">
      <a class="sign" href="/download/android" data-platform="android" data-sound="download">
        <canvas class="device" data-sprite="phone" width="11" height="13"></canvas>
        <span class="sign-text">
          <strong>Android</strong>
          <small data-meta="android"></small>
        </span>
        <span class="cta" data-i18n="download"></span>
      </a>
      <a class="sign" href="/download/windows" data-platform="windows" data-sound="download">
        <canvas class="device" data-sprite="monitor" width="16" height="13"></canvas>
        <span class="sign-text">
          <strong>Windows</strong>
          <small data-meta="windows"></small>
        </span>
        <span class="cta" data-i18n="download"></span>
      </a>
    </section>
    <section class="address">
      <span data-i18n="join"></span>
      <code>play.hacks.win</code>
    </section>
  </main>
  <nav class="toggles">
    <button class="toggle theme-toggle" type="button" aria-label="theme"><span></span></button>
    <button class="toggle sound-toggle" type="button" aria-label="sound"><span></span></button>
  </nav>
  <script src="/app.js" defer></script>
</body>
</html>
